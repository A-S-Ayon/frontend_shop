<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Shopify</title>
  <meta name="description" content="Select your shipping address and place your order." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav-root"></div>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>Checkout</h1>
        <p>Choose a delivery address and confirm your order.</p>
      </div>

      <!-- Loading state -->
      <div id="checkout-loading"><div class="spinner"></div></div>

      <!-- Error / success alerts -->
      <div id="checkout-alert" class="hidden"></div>

      <!-- Main checkout layout -->
      <div id="checkout-content" class="cart-layout hidden">
        <!-- Left column: address selection + add address form -->
        <div>
          <!-- Address selection -->
          <div class="card" style="margin-bottom: var(--space-5);">
            <div class="card__header">
              <span class="card__title">📍 Shipping Address</span>
              <button class="btn btn--ghost btn--sm" id="toggle-add-address-btn">
                + Add New Address
              </button>
            </div>
            <div class="card__body">
              <!-- Address list (radio cards) -->
              <div id="address-list" style="display:flex;flex-direction:column;gap:var(--space-3);">
                <div class="spinner"></div>
              </div>
            </div>
          </div>

          <!-- Add new address form (hidden by default) -->
          <div class="card hidden" id="add-address-form-card">
            <div class="card__header">
              <span class="card__title">New Shipping Address</span>
            </div>
            <div class="card__body">
              <div id="address-form-alert" class="hidden"></div>
              <form id="address-form">
                <div class="grid-2">
                  <div class="form-group">
                    <label class="form-label" for="label">Label (e.g. Home, Office)</label>
                    <input class="form-control" type="text" id="label" placeholder="Home" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="recipient_name">Recipient Name</label>
                    <input class="form-control" type="text" id="recipient_name" placeholder="Jane Doe" required />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="phone">Phone</label>
                  <input class="form-control" type="tel" id="phone" placeholder="+1 555 000 0000" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="address_line1">Address Line 1</label>
                  <input class="form-control" type="text" id="address_line1" placeholder="123 Main Street" required />
                </div>
                <div class="form-group">
                  <label class="form-label" for="address_line2">Address Line 2 (optional)</label>
                  <input class="form-control" type="text" id="address_line2" placeholder="Apt 4B" />
                </div>
                <div class="grid-2">
                  <div class="form-group">
                    <label class="form-label" for="city">City</label>
                    <input class="form-control" type="text" id="city" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="state">State / Province</label>
                    <input class="form-control" type="text" id="state" required />
                  </div>
                </div>
                <div class="grid-2">
                  <div class="form-group">
                    <label class="form-label" for="postal_code">Postal Code</label>
                    <input class="form-control" type="text" id="postal_code" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="country">Country</label>
                    <input class="form-control" type="text" id="country" placeholder="US" required />
                  </div>
                </div>
                <div class="form-group" style="flex-direction:row;align-items:center;gap:var(--space-2);">
                  <input type="checkbox" id="is_default" style="width:16px;height:16px;" />
                  <label class="form-label" for="is_default" style="margin:0;">Set as default address</label>
                </div>
                <div style="display:flex;gap:var(--space-3);">
                  <button class="btn btn--primary" type="submit" id="save-address-btn">Save Address</button>
                  <button class="btn btn--ghost" type="button" id="cancel-address-btn">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Right column: order summary + place order button -->
        <div class="order-summary">
          <div class="order-summary__title">Order Summary</div>
          <div class="order-summary__body" id="order-summary-body">
            <div class="spinner spinner--small"></div>
          </div>
          <div class="order-summary__footer">
            <!-- Wallet balance display -->
            <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:var(--space-3);">
              💰 Wallet balance: <strong id="wallet-balance">Loading…</strong>
            </div>
            <button
              class="btn btn--primary btn--full btn--lg"
              id="place-order-btn"
              onclick="handlePlaceOrder()"
            >
              Place Order
            </button>
            <p class="text-muted text-small" style="text-align:center;margin-top:var(--space-2);">
              Payment is deducted from your wallet balance.
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
