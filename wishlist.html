<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist — Shopify</title>
  <meta name="description" content="View and manage your saved wishlist items." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav-root"></div>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>My Wishlist</h1>
        <p>Items you've saved for later.</p>
      </div>

      <!-- Action alert (success/error for move-to-cart) -->
      <div id="wishlist-alert" class="hidden"></div>

      <!-- Loading -->
      <div id="wishlist-loading"><div class="spinner"></div></div>

      <!-- Error -->
      <div id="wishlist-error" class="hidden">
        <div class="alert alert--error">
          <span class="alert__icon">❌</span>
          <span id="wishlist-error-msg"></span>
        </div>
      </div>

      <!-- Empty state -->
      <div id="wishlist-empty" class="hidden empty-state">
        <div class="empty-icon">❤️</div>
        <p>Your wishlist is empty.</p>
        <a href="index.html" class="btn btn--primary">Browse Products</a>
      </div>

      <!-- Wishlist grid — cards injected by wishlist.js -->
      <div class="product-grid" id="wishlist-grid"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
