<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Shopify</title>
  <meta name="description" content="Reset your Shopify password. Enter your email and we'll send a reset link." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav-root"></div>

  <div class="auth-wrapper">
    <div class="auth-card animate-fade-in-up">
      <div class="auth-card__logo">
        <span class="logo-text">Shopify</span>
      </div>

      <h2>Reset your password</h2>
      <p>Enter your account email and we'll send you a link to reset your password.</p>

      <div id="alert-box" class="hidden"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            class="form-control"
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            required
            autocomplete="email"
          />
        </div>

        <button class="btn btn--primary btn--full btn--lg" type="submit" id="submit-btn">
          Send Reset Link
        </button>
      </form>

      <div class="auth-card__footer">
        <a href="login.html">← Back to login</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
