<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Shopify</title>
  <meta name="description" content="Set a new password for your Shopify account." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav-root"></div>

  <div class="auth-wrapper">
    <div class="auth-card animate-fade-in-up">
      <div class="auth-card__logo">
        <span class="logo-text">Shopify</span>
      </div>

      <h2>Set a new password</h2>
      <p>Enter and confirm your new password below.</p>

      <div id="alert-box" class="hidden"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <input
            class="form-control"
            type="password"
            id="new-password"
            name="new-password"
            placeholder="At least 8 characters"
            required
            autocomplete="new-password"
            minlength="8"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm New Password</label>
          <input
            class="form-control"
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Repeat your password"
            required
            autocomplete="new-password"
          />
        </div>

        <button class="btn btn--primary btn--full btn--lg" type="submit" id="submit-btn">
          Reset Password
        </button>
      </form>

      <div class="auth-card__footer">
        <a href="login.html">← Back to login</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
